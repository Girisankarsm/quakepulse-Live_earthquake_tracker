<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="QuakePulse  Global Seismic Intelligence">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1218"/>
      <stop offset="45%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#15202b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a7f74"/>
      <stop offset="50%" stop-color="#4a9b8e"/>
      <stop offset="100%" stop-color="#9ed9ce"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a66b"/>
      <stop offset="100%" stop-color="#e2c58a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#4a9b8e" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4a9b8e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4a9b8e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>

    <!-- subtle grid -->
    <g stroke="#c8d6e4" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200"/>
      <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420"/>
    </g>

    <!-- expanding epicenter rings -->
    <g transform="translate(980 210)" fill="none" stroke="#4a9b8e">
      <circle r="28" stroke-opacity="0.55" stroke-width="2">
        <animate attributeName="r" values="18;72;18" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="42" stroke-opacity="0.35" stroke-width="1.5">
        <animate attributeName="r" values="28;110;28" dur="3.2s" begin="0.55s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="3.2s" begin="0.55s" repeatCount="indefinite"/>
      </circle>
      <circle r="56" stroke-opacity="0.2" stroke-width="1">
        <animate attributeName="r" values="40;145;40" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="#4a9b8e" stroke="none" filter="url(#soft)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- seismic waveform -->
    <g transform="translate(80 268)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 40 C40 40 55 40 80 40 C110 40 120 8 150 8 C180 8 190 72 220 72 C250 72 260 20 290 20 C320 20 330 58 360 58 C390 58 405 40 440 40 C470 40 485 40 520 40 C550 40 565 12 595 12 C625 12 640 68 670 68 C700 68 715 34 745 34 C775 34 790 40 820 40 C850 40 870 40 900 40"
            stroke="#4a9b8e" stroke-width="3" stroke-opacity="0.9">
        <animate attributeName="stroke-dasharray" values="0 1200;1200 0" dur="2.8s" fill="freeze"/>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" begin="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M0 40 C40 40 55 40 80 40 C110 40 120 8 150 8 C180 8 190 72 220 72 C250 72 260 20 290 20 C320 20 330 58 360 58 C390 58 405 40 440 40 C470 40 485 40 520 40 C550 40 565 12 595 12 C625 12 640 68 670 68 C700 68 715 34 745 34 C775 34 790 40 820 40 C850 40 870 40 900 40"
            stroke="#9ed9ce" stroke-width="1.5" stroke-opacity="0.35" transform="translate(0 10)"/>
    </g>

    <!-- live dots along wave -->
    <g>
      <circle cx="310" cy="228" r="4" fill="#c9a66b">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="298" r="3.5" fill="#6ea3c4">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="675" cy="220" r="4" fill="#4a9b8e">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- brand mark -->
    <g transform="translate(80 78)">
      <circle cx="22" cy="22" r="22" fill="rgba(74,155,142,0.16)" stroke="#4a9b8e" stroke-opacity="0.45"/>
      <circle cx="22" cy="22" r="7" fill="#4a9b8e">
        <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="22" cy="22" r="14" fill="none" stroke="#9ed9ce" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.65;0.15;0.65" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="140" y="108" font-family="Outfit, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#e9eef4" letter-spacing="-0.5">QuakePulse</text>
    <text x="140" y="142" font-family="Outfit, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#92a0b0">Global Seismic Intelligence Platform</text>

    <!-- live badge -->
    <g transform="translate(80 168)">
      <rect width="118" height="30" rx="15" fill="rgba(74,155,142,0.16)" stroke="rgba(74,155,142,0.35)"/>
      <circle cx="18" cy="15" r="5" fill="#6bbf9a">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="600" fill="#9ed9ce" letter-spacing="1.5">LIVE FEED</text>
    </g>

    <text x="80" y="240" font-family="Outfit, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6d7c8d">USGS · maps · depth analytics · ML risk nowcast · news</text>

    <!-- floating chips -->
    <g font-family="Outfit, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <g transform="translate(700 70)">
        <rect width="92" height="28" rx="10" fill="rgba(28,38,50,0.9)" stroke="rgba(200,214,228,0.14)"/>
        <text x="46" y="18" text-anchor="middle" fill="#9ed9ce">Map</text>
        <animateTransform attributeName="transform" type="translate" values="700 70;700 64;700 70" dur="3.4s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(810 95)">
        <rect width="108" height="28" rx="10" fill="rgba(28,38,50,0.9)" stroke="rgba(200,214,228,0.14)"/>
        <text x="54" y="18" text-anchor="middle" fill="#c9a66b">Analytics</text>
        <animateTransform attributeName="transform" type="translate" values="810 95;810 88;810 95" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(740 125)">
        <rect width="100" height="28" rx="10" fill="rgba(28,38,50,0.9)" stroke="rgba(200,214,228,0.14)"/>
        <text x="50" y="18" text-anchor="middle" fill="#6ea3c4">Predict</text>
        <animateTransform attributeName="transform" type="translate" values="740 125;740 119;740 125" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="rgba(200,214,228,0.12)" stroke-width="2"/>
</svg>
